<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Smart Watch Pro</h1>
        <p>Your perfect fitness and lifestyle companion</p>
    </header>
    <section class="product">
        <div class="product-content">
            <img src="https://a.allegroimg.com/original/113ebc/2d8386054736ab1f211511ba1900/Zegarek-smartwatch-pulsometr-wiele-funkcji-rozmowy-polaczenia" alt="Product Image">
            <div class="product-text">
                <h2>Why Choose Smart Watch Pro?</h2>
                <p>
                    Smart Watch Pro helps you track your fitness, monitor your health,
                    and stay connected on the go. Designed with style, comfort, and
                    performance in mind.
                </p>
                <button>Buy Now</button>
            </div>
        </div>
    </section>

</body>
<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background-color: #f4f4f4;
    color: #333;
}
.header {
    background: linear-gradient(to right, #667eea, #764ba2);
    color: white;
    text-align: center;
    padding: 60px 20px;
}

.header h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.header p {
    font-size: 18px;
}
.product {
    padding: 50px 20px;
    background-color: #ffffff;
}

.product-content {
    max-width: 1000px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 40px;
}

.product-content img {
    width: 300px;
    border-radius: 10px;
}
.product-text h2 {
    font-size: 28px;
    color: #764ba2;
}

.product-text p {
    font-size: 16px;
    line-height: 1.6;
    margin: 15px 0;
}
button {
    background-color: #667eea;
    color: white;
    border: none;
    padding: 12px 25px;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #5a67d8;
}

</style>
</html>
