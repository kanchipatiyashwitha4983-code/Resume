<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-container">
        <section class="section product">
            <h1>Smart Watch</h1>
            <img src="https://a.allegroimg.com/original/113ebc/2d8386054736ab1f211511ba1900/Zegarek-smartwatch-pulsometr-wiele-funkcji-rozmowy-polaczenia" alt="Product Image">
            <p>
                This smart watch helps you track your fitness, monitor health,
                and stay connected with notifications.
            </p>
        </section>
        <section class="section features">
            <h2>Features</h2>
            <ul>
                <li>Heart Rate Monitoring</li>
                <li>Sleep Tracking</li>
                <li>Water Resistant</li>
                <li>Long Battery Life</li>
            </ul>
        </section>
        <section class="section testimonials">
            <h2>Testimonials</h2>
            <p>
                ⭐⭐⭐⭐⭐ <br>
                "Amazing product! Very useful and stylish."  
                <br>– Customer A
            </p>
        </section>

    </div>

</body>
<style>
* {
    box-sizing: border-box;
}
.page-container {
    width: 80%;
    margin: 20px auto;
    font-family: Arial, sans-serif;
}
.section {
    border: 2px solid #333;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px; 
    background-color: #f9f9f9;
}
.product img {
    display: block;
    margin: 10px auto;
    border: 1px solid #ccc;
    padding: 5px;
    width: 300px;
}
h1, h2 {
    text-align: center;
}
.features ul {
    padding-left: 20px;
}
.testimonials p {
    text-align: center;
    font-style: italic;
}

</style>
</html>
